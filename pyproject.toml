[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-codegen-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.21.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

