[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-codegen-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.21.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0"]
# Notebook stack for `notebooks/`: benchmark subset selection and its figures.
# Kept out of the runtime dependency so a run of the platform does not drag in
# a plotting stack it never uses.
analysis = [
    "jupyterlab>=4.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The CodeTeam patch is read from beside its agent module and uploaded into the
# task container. A build that dropped it would install an arm whose repair loop
# never runs, which is the one failure this whole patch exists to prevent.
evaluation_platform = ["*.patch"]

