# Experiment setup: Self-Collaboration against the whole NL2RepoBench
# benchmark — all 104 tasks of the pinned dataset.
#
# The benchmark is a dependency, not a checked-in copy: Harbor's registry
# holds it as a digest-pinned dataset, and `benchmark.ref` fixes the version
# every run of this configuration uses. Comparing a second code generation
# solution means copying this file, changing only the `agent` section, and
# leaving the `benchmark` block byte-identical.
#
# Scale: 104 tasks, each with its own tester image and its own agent and
# verifier timeouts. Run sequentially the benchmark takes about ten hours, so
# what makes it practical is `run.n_concurrent_trials` below. Start from
# `math-verify-self-collaboration.yaml` when iterating on the setup itself.

name: nl2repobench-self-collaboration
description: >-
  Self-Collaboration (Analyst -> Coder <-> Tester) generates every
  NL2RepoBench library from its natural-language specification. Each task's
  hidden reference tests stay in its tester sidecar; the reward per task is the
  fraction of them that pass.

run:
  jobs_dir: jobs
  n_attempts: 1
  # How many tasks execute at once. This is the setting that decides whether
  # the benchmark takes ten hours or two, and the one to match to the machine:
  # each NL2RepoBench task declares a ceiling of 2 CPUs and 8 GB, and the
  # launcher reports how that compares with what Docker actually has before
  # the first container starts.
  #
  # Four suits a machine giving Docker around 8 GB. Tasks spend most of their
  # time waiting on the model rather than on this machine's processors, so
  # concurrency well above the core count still pays; memory is the ceiling
  # that bites, because a trial that reaches its limit is killed and scored as
  # a failed task rather than merely slowed down.
  n_concurrent_trials: 4
  # What a transient failure costs. Over 104 tasks a provider hiccup or a lost
  # connection is close to certain, and without this the affected task is
  # scored as an error and its result is simply missing from the run. Harbor's
  # own exclusions still apply, so the failures that a retry cannot fix — a
  # timeout, an exhausted usage limit, a rejected credential — fail once
  # rather than three times.
  retry:
    max_retries: 2
    wait_multiplier: 2
    min_wait_sec: 5
    max_wait_sec: 120
  artifacts:
    - /workspace

benchmark:
  dataset: nl2repobench/nl2repobench
  # The dataset's content digest. Resolved and re-pinned at launch, and
  # recorded in `jobs/<job>/benchmark.json` alongside the selected tasks.
  ref: sha256:b0d58e327ee30a6e6584bd4843a53db52a3442e230630369da095ec564542712
  # Select a subset with `task_names` (glob patterns, org-qualified),
  # `exclude_task_names`, or `n_tasks`. With none of them, the run covers the
  # entire benchmark.
  #
  # The published tasks name their tester images on a private mirror that needs
  # credentials this project does not have. The same images are public on GHCR,
  # so each selected task's image is pulled from `pull_from` and made available
  # locally under the name in `expects`. The benchmark's own files are never
  # modified.
  image_mirror:
    - expects: us-docker.pkg.dev/cybertron-gcp-island-test-0rxn/applejax/walker_cheng/nl2repobench/
      pull_from: ghcr.io/multimodal-art-projection/nl2repobench/

model:
  provider: ${MODEL_PROVIDER:-openrouter}
  name: ${MODEL:-moonshotai/kimi-k2.5}
  base_url: ${BASE_URL:-https://openrouter.ai/api/v1}
  api_key_env: API_KEY

agent:
  import_path: evaluation_platform.self_collaboration_agent:SelfCollaborationAgent
  # A sub-limit within `n_concurrent_trials` on how many trials may be calling
  # the model at the same time. Equal to it, as here, it does nothing; lower it
  # to stay under a provider's rate limit without giving up the concurrency
  # that container setup, installation, and verification still get.
  n_concurrent: 4
  # The revision of the code generation tool under evaluation: the authors'
  # own repository at its current head, with nothing of ours in it. What
  # running it unmodified costs on a benchmark written from scratch, and what
  # the test command below does about that, is described in
  # docs/latex/tool-modifications.tex.
  repository: https://github.com/YihongDong/Self-collaboration-Code-Generation.git
  commit: a6490a9d0d32f3238cc5b776d2de8d2134d2b138
  hyperparameters:
    max_rounds: 3
    analyst_steps: 10
    coder_steps: 15
    max_tokens: 8192
    temperature: 0.0
    # Recorded, but inert on this revision: the tool declares `top_p` and sends
    # it only from its non-agentic entry point, so the Analyst and the Coder
    # sample at the provider's default. The value here is the tool's own
    # default, so the record states an intent it does not misrepresent.
    top_p: 0.95
    # Reasoning is deliberately not configured. The revision under evaluation
    # sends no reasoning field on its tool-calling path, so how much the model
    # reasons is the provider's default for it at that moment: set outside the
    # experiment, absent from its written setup, and free to change between
    # runs. Asking for it here with `reasoning_effort` or `request_extra` fails
    # the run at startup rather than being silently dropped, which is the point
    # — the alternative is a patched tool. What the model actually did is still
    # recorded after the fact, as `reasoning_tokens` in the run's model usage.
    #
    # The first line is the one accommodation this experiment makes for running
    # the tool unmodified, and it is made here rather than in the tool. The
    # session decides whether the Coder produced anything by reading
    # `git diff`, which on a project written from scratch reports nothing at
    # all, because every generated file is untracked. Without this the Tester
    # would discard a genuine test result on every round and substitute "No
    # code changes were made", and could never report success.
    # `--intent-to-add` registers the files with the index without committing
    # them, which is what makes them visible to `git diff`. It runs before the
    # tests rather than after, so that a test run which times out still leaves
    # the workspace readable; build output is kept out of it by
    # `.git/info/exclude`, written by run_self_collaboration.py.
    #
    # pytest exits 5 when it collects nothing, which the Tester reports as a
    # failure with no explanation, and the next Coder round is told its work
    # was incorrect. On a project built from scratch that is the normal state
    # until the agent writes its tests, so the command says so explicitly.
    # The message goes to stderr, which the tool appends last, so it survives
    # the summarizer's fallback to the tail of the output.
    test_command: |
      git add --intent-to-add .
      python -m pip install -e . -q
      python -m pytest -q --continue-on-collection-errors
      status=$?
      if [ "$status" -eq 5 ]; then
        echo "No tests were collected. The project has no test suite yet: write tests that exercise the public API described in the task, then make them pass." >&2
      fi
      exit $status
