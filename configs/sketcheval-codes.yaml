# Experiment setup: CodeS on SketchEval, the benchmark of its own paper.
#
# This is `math-verify-codes.yaml` pointed at a different benchmark, and the
# `model` and `agent` blocks below are byte-identical to that file's. What
# differs is `benchmark`, and one thing about `benchmark` differs from every
# other configuration here: the reward is not a fraction of tests that passed.
#
# SketchEval scores a generated repository against a reference repository with
# SketchBLEU — the CodeS authors' `calc_repobleu` — which is a similarity
# measure in [0, 1]: a quarter each of n-gram match, keyword-weighted n-gram
# match, AST subtree match and dataflow match. Nothing is executed and there
# are no hidden tests. A SketchEval reward and an NL2RepoBench reward are
# therefore different quantities. They do not pool, they do not average, and a
# figure that puts them on one axis is measuring nothing.
#
# Two further properties of this benchmark belong in front of any result:
#
# The attainable ceiling is below 1.0 and differs per repository. Scoring a
# reference tree against itself returns 1.0 for three components and less for
# dataflow, because tree-sitter extracts no dataflow from some functions and
# the assignment leaves those unmatched. epubhv's oracle scores 0.9857, not
# 1.0. `benchmarks/sketcheval/README.md` carries the measured figures; read any
# reward against its repository's ceiling rather than against 1.0.
#
# This benchmark is CodeS's own. SketchEval was introduced by the CodeS paper
# and ships inside the CodeS repository, so this arm is being evaluated on
# ground its authors chose. That is worth knowing when it is compared with an
# arm evaluated on NL2RepoBench, which belongs to nobody here.
#
# `benchmark.path` rather than `benchmark.dataset`: Harbor's registry carries
# no SketchEval — it is not published as a dataset anywhere — so the tasks are
# generated from the pinned CodeS commit by
# `scripts/build_sketcheval_tasks.py`. Run that once before the first run.
# What a registry ref would have pinned, a digest over the generated tree pins
# instead; the launcher computes it and archives it beside the job.
#
# Everything that changes what a run does belongs in a file under `configs/`.
# Launch it with `python main.py --config configs/sketcheval-codes.yaml`; the
# launcher archives the resolved setup as `jobs/<job>/experiment-config.yaml`,
# so any recorded result can be traced back to the configuration that produced
# it. `.env` holds credentials only.
#
# `${VAR:-default}` reads VAR from the environment (including `.env`) and falls
# back to the literal after `:-`. The archived snapshot stores the resolved
# value, never the template.

name: sketcheval-codes
description: >-
  CodeS (RepoSketcher -> FileSketcher -> SketchFiller) generates each SketchEval
  repository from its README, which is the whole of the specification. The
  reward is SketchBLEU against the reference repository, which the agent never
  sees; it is a similarity score rather than a passing fraction, and its
  ceiling is below 1.0.

run:
  jobs_dir: jobs
  n_attempts: 5
  n_concurrent_trials: 10
  artifacts:
    - /workspace

benchmark:
  # Generated by scripts/build_sketcheval_tasks.py from the digest-pinned
  # commit in benchmarks/sketcheval/data. No `ref`: a local benchmark is pinned
  # by the digest the launcher computes over this tree, which it records in
  # jobs/<job>/benchmark.json and in the archived setup.
  path: benchmarks/sketcheval/tasks
  # One task, because the nineteen are not one cost. A SketchEval trial pays
  # one request for the repository sketch, one per Python file in it, and one
  # per function in those — so a large repository costs several times a small
  # one, and `pyobd`'s reference alone carries 268 functions.
  #
  # `n_tasks` truncates after filtering, in the order the packages are
  # discovered, so it selects *a* task rather than a chosen one. To pin a
  # specific repository, name it instead — the directory name is the task name,
  # and `task_names` accepts globs:
  #
  #   task_names:
  #     - epubhv
  #
  # The five `easy` repositories are CVE-2023-44487, EVM_inscription,
  # pitch-visualizer, smol-podcaster and web.Monitor; `task.toml` records each
  # repository's difficulty under the CodeS authors' own size rule.
#  n_tasks: 1

model:
  provider: ${MODEL_PROVIDER:-openrouter}
  name: openai/gpt-4o-mini
  base_url: ${BASE_URL:-https://openrouter.ai/api/v1}
  api_key_env: API_KEY
  routing:
    order:
      - openai
#      - baidu/fp8
#      - siliconflow/fp8
    allow_fallbacks: false

agent:
  import_path: evaluation_platform.codes_agent:CodeSAgent
  n_concurrent: 10
  repository: https://github.com/NL2Code/CodeS.git
  commit: 0b624ab4ef22b0d9d223f274a986eb27fe090c88
  hyperparameters:
    # CodeS is a pipeline rather than a team, so there are no roles to size and
    # no rounds to bound. Its shape is decided by the model instead: the
    # repository sketch names the files, each Python file among them costs one
    # file-sketch request, and every function declared in those sketches costs
    # one more. A specification that invites a wide design therefore costs
    # several times what a narrow one does, and nothing in the tool notices.
    #
    # What a configuration states about CodeS is accordingly how a request is
    # made, how many are in flight, and when to stop.

    # Requests. Five attempts are the tool's own figure, hardcoded in its
    # driver and written out here so it is part of the record and can be
    # varied. The first attempt uses the run's shared temperature and the rest
    # use `retry_temperature`, which stays a hyperparameter because it is not a
    # setting the other arms have: it is what this tool does with a request the
    # provider refused, rather than how the comparison samples.
    request_attempts: 5
    retry_temperature: 0.2
    # What the aggregator's silence costs. OpenRouter answers a non-streaming
    # request by returning the headers at once and the body when the provider
    # is done, so a stalled reply is indistinguishable from a slow one and
    # moves no bytes at all while it hangs. The client's own default is ten
    # minutes per read with two retries beneath the five attempts above, which
    # is two and a half hours for one file sketch; this is the figure the other
    # arms use, applied once rather than nine times.
    request_timeout_seconds: 600
    request_extra:
      reasoning:
        enabled: false
    concurrent_requests: 40
    # Under the task's own `[agent] timeout_sec = 3600`, not equal to it. The
    # budget is what lets a run stop itself and assemble what it paid for; a
    # budget that can only be reached at the same moment Harbor's timeout is
    # reached is never the one that fires, and a killed container writes no
    # repository, no records and no usage. The headroom covers the one attempt
    # already in flight when the budget is spent (`request_timeout_seconds`
    # above) and the assembly stage that follows.
    max_wall_clock_seconds: 2700
    max_token_budget: 2000000
