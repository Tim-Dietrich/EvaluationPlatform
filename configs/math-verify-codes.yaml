# Experiment setup: CodeS on a single NL2RepoBench task.
#
# This is the third code generation solution evaluated in this repository, and
# it is the counterpart of `math-verify-self-collaboration.yaml` and
# `math-verify-codeteam.yaml`: the same benchmark, the same task, the same
# model backend. The `benchmark` and `model` blocks are byte-identical to those
# files, so a difference between the three runs is a difference between the
# three solutions rather than between three setups. The `run` block is the
# exception, and is not part of that claim: how many attempts to make and how
# many to run at once is how much of the experiment to do rather than what it
# measures.
#
# Everything that changes what a run does belongs in a file under `configs/`.
# Launch it with `python main.py --config configs/math-verify-codes.yaml`; the
# launcher archives the resolved setup as `jobs/<job>/experiment-config.yaml`,
# so any recorded result can be traced back to the configuration that produced
# it. `.env` holds credentials only.
#
# `${VAR:-default}` reads VAR from the environment (including `.env`) and falls
# back to the literal after `:-`. The archived snapshot stores the resolved
# value, never the template.

name: math-verify-codes
description: >-
  CodeS (RepoSketcher -> FileSketcher -> SketchFiller) generates the
  math-verify library from NL2RepoBench's natural-language specification. The
  hidden reference tests stay in the tester sidecar and are never visible to
  the agent; the reward is the fraction of them that pass.

run:
  jobs_dir: jobs
  n_attempts: 1
  n_concurrent_trials: 1
  artifacts:
    - /workspace

benchmark:
  dataset: nl2repobench/nl2repobench
  ref: sha256:b0d58e327ee30a6e6584bd4843a53db52a3442e230630369da095ec564542712
  task_names:
    - nl2repobench/math-verify
  image_mirror:
    - expects: us-docker.pkg.dev/cybertron-gcp-island-test-0rxn/applejax/walker_cheng/nl2repobench/
      pull_from: ghcr.io/multimodal-art-projection/nl2repobench/

model:
  provider: ${MODEL_PROVIDER:-openrouter}
  name: openai/gpt-3.5-turbo
  base_url: ${BASE_URL:-https://openrouter.ai/api/v1}
  api_key_env: API_KEY
  routing:
    order:
      - openai
#      - baidu/fp8
#      - siliconflow/fp8
    allow_fallbacks: false

agent:
  import_path: evaluation_platform.codes_agent:CodeSAgent
  n_concurrent: 1
  repository: https://github.com/NL2Code/CodeS.git
  commit: 0b624ab4ef22b0d9d223f274a986eb27fe090c88
  hyperparameters:
    # CodeS is a pipeline rather than a team, so there are no roles to size and
    # no rounds to bound. Its shape is decided by the model instead: the
    # repository sketch names the files, each Python file among them costs one
    # file-sketch request, and every function declared in those sketches costs
    # one more. A specification that invites a wide design therefore costs
    # several times what a narrow one does, and nothing in the tool notices.
    #
    # What a configuration states about CodeS is accordingly how a request is
    # made, how many are in flight, and when to stop.

    # Requests. Five attempts are the tool's own figure, hardcoded in its
    # driver and written out here so it is part of the record and can be
    # varied. The first attempt uses the run's shared temperature and the rest
    # use `retry_temperature`, which stays a hyperparameter because it is not a
    # setting the other arms have: it is what this tool does with a request the
    # provider refused, rather than how the comparison samples.
    request_attempts: 5
    retry_temperature: 0.2
    # What the aggregator's silence costs. OpenRouter answers a non-streaming
    # request by returning the headers at once and the body when the provider
    # is done, so a stalled reply is indistinguishable from a slow one and
    # moves no bytes at all while it hangs. The client's own default is ten
    # minutes per read with two retries beneath the five attempts above, which
    # is two and a half hours for one file sketch; this is the figure the other
    # arms use, applied once rather than nine times.
    request_timeout_seconds: 600
    request_extra:
      reasoning:
        enabled: false
    concurrent_requests: 40
    # Under the task's own `[agent] timeout_sec = 3600`, not equal to it. The
    # budget is what lets a run stop itself and assemble what it paid for; a
    # budget that can only be reached at the same moment Harbor's timeout is
    # reached is never the one that fires, and a killed container writes no
    # repository, no records and no usage. The headroom covers the one attempt
    # already in flight when the budget is spent (`request_timeout_seconds`
    # above) and the assembly stage that follows.
    max_wall_clock_seconds: 2700
    max_token_budget: 2000000
