# Experiment setup: one Self-Collaboration attempt on a single NL2RepoBench
# task. This is the smoke-test scale of `nl2repobench-self-collaboration.yaml`
# — same benchmark, same agent, one task — for iterating on the setup without
# paying for a full benchmark run.
#
# Everything that changes what a run does belongs in a file under `configs/`.
# Launch it with `python main.py --config configs/<name>.yaml`; the launcher
# archives the resolved setup as `jobs/<job>/experiment-config.yaml`, so any
# recorded result can be traced back to the configuration that produced it.
# `.env` holds credentials only.
#
# `${VAR:-default}` reads VAR from the environment (including `.env`) and falls
# back to the literal after `:-`. The archived snapshot stores the resolved
# value, never the template.

name: math-verify-self-collaboration
description: >-
  Self-Collaboration (Analyst -> Coder <-> Tester) generates the math-verify
  library from NL2RepoBench's natural-language specification. The hidden
  reference tests stay in the tester sidecar and are never visible to the
  agent; the reward is the fraction of them that pass.

run:
  jobs_dir: jobs
  n_attempts: 5
  n_concurrent_trials: 5
  artifacts:
    - /workspace

benchmark:
  dataset: nl2repobench/nl2repobench
  ref: sha256:b0d58e327ee30a6e6584bd4843a53db52a3442e230630369da095ec564542712
  task_names:
    - nl2repobench/math-verify
  image_mirror:
    - expects: us-docker.pkg.dev/cybertron-gcp-island-test-0rxn/applejax/walker_cheng/nl2repobench/
      pull_from: ghcr.io/multimodal-art-projection/nl2repobench/

model:
  provider: ${MODEL_PROVIDER:-openrouter}
  name: ${MODEL:-moonshotai/kimi-k2.5}
  base_url: ${BASE_URL:-https://openrouter.ai/api/v1}
  api_key_env: API_KEY
  # Which of the aggregator's servers may answer. A model name does not name a
  # server: OpenRouter offers this model from more than twenty providers that
  # serve different quantizations of the same weights — fp4, fp8, bf16 — at
  # very different speeds, and its default route is chosen by price. Unpinned,
  # two arms of this comparison can run the same model at different numerical
  # precision, and so can two requests inside one arm, with nothing recording
  # which. That is a confound in the one variable every configuration here
  # holds constant, so it is pinned beside the model rather than left to the
  # aggregator, and it belongs in `model` rather than in any solution's
  # hyperparameters because it is not a property of a method. The test that
  # requires these blocks to agree across configurations is therefore the test
  # that keeps every arm on one server.
  #
  # Measured on 2026-08-26, one 500-token generation each: the default route
  # landed on open-inference/fp4 at 11 tok/s, which is ~51 minutes for a
  # 32k-token reply. baidu/fp8 gave ~190 tok/s at $0.28 per million output
  # tokens, the best speed for the money among the endpoints this account may
  # use. siliconflow/fp8 is the named second choice because it is the only
  # high-uptime endpoint that is *also* declared fp8, so a fallback keeps the
  # precision this pin exists to fix; `allow_fallbacks: false` stops the
  # aggregator substituting anything outside the pair.
  #
  # These tags name endpoints *of the model above*. Changing the model means
  # choosing them again — `GET /api/v1/models/<model>/endpoints` lists what is
  # on offer, with each endpoint's quantization and price.
  routing:
    order:
      - baidu/fp8
      - siliconflow/fp8
    allow_fallbacks: false

agent:
  import_path: evaluation_platform.self_collaboration_agent:SelfCollaborationAgent
  n_concurrent: 5
  # The revision of the code generation tool under evaluation. Pinning it here
  # keeps the tool's version part of the recorded setup. It is the authors' own
  # repository at its current head, with nothing of ours in it; what running it
  # unmodified costs on a benchmark written from scratch, and what the test
  # command below does about that, is described in
  # docs/latex/tool-modifications.tex.
  repository: https://github.com/YihongDong/Self-collaboration-Code-Generation.git
  commit: a6490a9d0d32f3238cc5b776d2de8d2134d2b138
  hyperparameters:
    # Coder rounds. The Tester runs between rounds, so `max_rounds: 1` leaves
    # the team at Analyst -> Coder with no verification step at all.
    max_rounds: 3
    analyst_steps: 10
    coder_steps: 15
    # Sampling — `temperature`, `top_p` and `max_tokens` — is not stated here.
    # It is set for every arm at once in `configs/generation.yaml`, so that a
    # difference between this run and the arms beside it is a difference in
    # method. Stating one of the three here is rejected before Docker starts.

    # One note that the shared file cannot carry, because it is about this
    # revision rather than about the comparison: `top_p` is inert here. The tool
    # declares it and sends it only from its non-agentic entry point, so the
    # Analyst and the Coder sample at the provider's default for it whatever the
    # shared file says. The run's `resolved-setup.json` records the value that
    # was resolved, as every arm's does.
    # Reasoning is deliberately not configured. The revision under evaluation
    # sends no reasoning field on its tool-calling path, so how much the model
    # reasons is the provider's default for it at that moment: set outside the
    # experiment, absent from its written setup, and free to change between
    # runs. Asking for it here with `reasoning_effort` or `request_extra` fails
    # the run at startup rather than being silently dropped, which is the point
    # — the alternative is a patched tool. What the model actually did is still
    # recorded after the fact, as `reasoning_tokens` in the run's model usage.
    #
    # What the Tester runs in the agent's own workspace between Coder rounds.
    # This exercises only the code and tests the agent wrote itself; the
    # benchmark's reference tests live in the tester sidecar and stay hidden.
    # Drop this key to disable the Tester phase.
    #
    # The first line is the one accommodation this experiment makes for running
    # the tool unmodified, and it is made here rather than in the tool. The
    # session decides whether the Coder produced anything by reading
    # `git diff`, which on a project written from scratch reports nothing at
    # all, because every generated file is untracked. Without this the Tester
    # would discard a genuine test result on every round and substitute "No
    # code changes were made", and could never report success.
    # `--intent-to-add` registers the files with the index without committing
    # them, which is what makes them visible to `git diff`. It runs before the
    # tests rather than after, so that a test run which times out still leaves
    # the workspace readable; build output is kept out of it by
    # `.git/info/exclude`, written by run_self_collaboration.py.
    #
    # pytest exits 5 when it collects nothing, which the Tester reports as a
    # failure with no explanation, and the next Coder round is told its work
    # was incorrect. On a project built from scratch that is the normal state
    # until the agent writes its tests, so the command says so explicitly.
    # The message goes to stderr, which the tool appends last, so it survives
    # the summarizer's fallback to the tail of the output.
    test_command: |
      git add --intent-to-add .
      python -m pip install -e . -q
      python -m pytest -q --continue-on-collection-errors
      status=$?
      if [ "$status" -eq 5 ]; then
        echo "No tests were collected. The project has no test suite yet: write tests that exercise the public API described in the task, then make them pass." >&2
      fi
      exit $status
